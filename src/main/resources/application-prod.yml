server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Only a reverse proxy on the same host may set X-Forwarded-* headers.
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
      timeout: 30m

app:
  cleanup:
    retention-hours: 1

logging:
  structured:
    format:
      console: logstash
  level:
    pl.mlkmn.ytdeferreduploader: INFO

spring:
  thymeleaf:
    cache: true
  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
