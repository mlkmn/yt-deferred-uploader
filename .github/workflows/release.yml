name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: ./gradlew test -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Build boot jar
        run: ./gradlew bootJar -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Rename jar and write checksum
        run: |
          mkdir dist
          JAR="yt-deferred-uploader-${{ steps.version.outputs.tag }}.jar"
          cp "build/libs/yt-deferred-uploader-${{ steps.version.outputs.version }}.jar" "dist/$JAR"
          cd dist
          sha256sum "$JAR" > "$JAR.sha256"
          sha256sum -c "$JAR.sha256"
          cat "$JAR.sha256"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: build/reports/tests/test/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --verify-tag --generate-notes ${{ steps.version.outputs.prerelease }} \
            --title "${{ steps.version.outputs.tag }}"
